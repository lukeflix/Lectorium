name: Build Lectorium APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev cmake \
            libffi-dev libssl-dev build-essential python3-pip
      - name: Instalar Buildozer
        run: pip install buildozer cython==0.29.37
      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
      - name: Compilar APK
        run: buildozer android debug 2>&1 | tail -100
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: lectorium-debug-apk
          path: bin/*.apk
          retention-days: 30
